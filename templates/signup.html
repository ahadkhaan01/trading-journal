<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trade Journal - Sign Up</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="login-box">

            <div class="logo">
                📈
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Start tracking your trading journey.
            </p>

            <form method="POST">

                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

            <p class="signup">
                Already have an account?
                <a href="{{ url_for('login') }}">Login</a>
            </p>

        </div>

    </div>

</body>

</html>
