<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trade Journal</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="login-box">

            <div class="logo">
                📈
            </div>

            <h1>Trade Journal</h1>

            <p class="subtitle">
                Track. Analyze. Improve.
            </p>

            <h2>Welcome Back</h2>

            <form method = "POST">

                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="signup">
                Don't have an account?
            <a href="{{ url_for('signup') }}">Create Account</a>
            </p>

        </div>

    </div>

</body>

</html>
