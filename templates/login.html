<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Trading Journal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #24103a 0%, #08000d 45%, #040006 100%);
            color: white;
        }

        .container {
            width: 92%;
            max-width: 430px;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            margin: 0;
            color: #c084fc;
            font-size: 32px;
            letter-spacing: 3px;
        }

        .logo p {
            margin-top: 8px;
            color: #9f8baa;
            font-size: 13px;
        }

        .card {
            background: rgba(18, 9, 26, 0.96);
            border: 1px solid #3f1d50;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.10);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #e9d5ff;
            text-align: center;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #d8b4fe;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 9px;
            border: 1px solid #4c1d95;
            background: #09000f;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.18);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #c084fc;
            cursor: pointer;
            font-size: 12px;
        }

        .login-button {
            width: 100%;
            border: none;
            border-radius: 9px;
            padding: 14px;
            background: #9333ea;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-button:hover {
            background: #a855f7;
        }

        .flash {
            background: #291032;
            border: 1px solid #9333ea;
            color: #f3e8ff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 13px;
        }

        .signup {
            text-align: center;
            margin-top: 22px;
            color: #8f7aa0;
            font-size: 13px;
        }

        .signup a {
            color: #c084fc;
            text-decoration: none;
            font-weight: bold;
        }

        .signup a:hover {
            color: #e9d5ff;
        }

        .security {
            text-align: center;
            margin-top: 20px;
            color: #6f6078;
            font-size: 11px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>TRADELOG</h1>
        <p>Trading Command Center</p>
    </div>

    <div class="card">

        <h2>Welcome Back</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}

        <form method="POST">

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                    autocomplete="email"
                >

            </div>

            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                    >
                        SHOW
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="login-button"
            >
                LOGIN
            </button>

        </form>

        <div class="signup">
            Don't have an account?
            <a href="{{ url_for('signup') }}">
                Create Account
            </a>
        </div>

        <div class="security">
            🔒 Your trading data is protected
        </div>

    </div>

</div>

<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".show-password");

    if (password.type === "password") {

        password.type = "text";
        button.textContent = "HIDE";

    } else {

        password.type = "password";
        button.textContent = "SHOW";

    }

}

</script>

</body>
</html>
